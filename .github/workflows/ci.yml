name: Checks and delivery

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routine:
    name: Routine checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Provision check tools
        run: |
          make setup-check
          python -m pip install --only-binary=:all: ruff==0.17.5
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc shellcheck
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make ci-check

  browser:
    name: Browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Provision pinned Chromium
        run: |
          make setup-browser
          ./node_modules/.bin/playwright-core install --with-deps --only-shell chromium
      - run: make check-browser

  native:
    name: Linux native build and GLSL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Panda3D SDK and GLSL validator
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://www.panda3d.org/download/panda3d-1.10.16/panda3d1.10_1.10.16~noble_amd64.deb \
            -o panda3d.deb
          echo 'eb40c1417c3cb7a6b045bf23fcaaddd82da7d9874ee83d35edf1a98d2339ba1c  panda3d.deb' | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./panda3d.deb python3.12-dev glslang-tools
      - run: make check-native check-shaders

  deliver:
    name: Package Shader Field Guide
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [routine, browser, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shader-field-guide-${{ github.sha }}
          path: |
            shader-field-guide/demo.html
            shader-field-guide/index.html
            shader-field-guide/GUIDE.md
            shader-field-guide/README.md
            shader-field-guide/LICENSE
            shader-field-guide/src/
          if-no-files-found: error
          retention-days: 14
